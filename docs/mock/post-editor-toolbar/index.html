<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ブログ作成画面 モック — Markdown ツールバー強化案</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      body {
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          'Hiragino Sans', 'Noto Sans JP', sans-serif;
      }
      .cm-mono {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </head>
  <body class="bg-neutral-100/60 text-neutral-900">
    <div class="mx-auto w-full max-w-5xl px-4 py-8">
      <!-- ===== エディタカード ===== -->
      <div class="flex flex-col rounded-xl border-none bg-white shadow">
        <!-- ===== ヘッダー（ツールバー）===== -->
        <div
          class="flex flex-wrap items-center justify-between gap-3 border-b border-neutral-200 px-4 py-3 lg:px-6"
        >
          <!-- 左：Edit/Preview 切替 + 書式ツールバー -->
          <div class="flex flex-wrap items-center gap-2">
            <!-- Edit / Preview トグル -->
            <div
              class="relative flex h-9 w-20 items-center justify-between rounded-full bg-neutral-200"
            >
              <div
                class="absolute left-[2px] h-8 w-8 rounded-full border border-neutral-300 bg-white shadow-sm"
              ></div>
              <div class="relative z-10 flex h-9 w-9 items-center justify-center text-neutral-900">
                <i data-lucide="pencil" class="h-4 w-4"></i>
              </div>
              <div class="relative z-10 flex h-9 w-9 items-center justify-center text-neutral-400">
                <i data-lucide="eye" class="h-4 w-4"></i>
              </div>
            </div>

            <div class="mx-1 h-6 w-px bg-neutral-200"></div>

            <!-- 書式ボタングループ -->
            <div class="flex flex-wrap items-center gap-0.5">
              <!-- 見出し（ドロップダウン想定） -->
              <button
                class="group flex h-8 items-center gap-0.5 rounded-md px-2 text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                title="見出し"
              >
                <i data-lucide="heading" class="h-[18px] w-[18px]"></i>
                <i data-lucide="chevron-down" class="h-3 w-3 text-neutral-400"></i>
              </button>

              <div class="mx-1 h-5 w-px bg-neutral-200"></div>

              <!-- 太字 -->
              <button
                class="flex h-8 w-8 items-center justify-center rounded-md text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                title="太字 (Ctrl+B)"
              >
                <i data-lucide="bold" class="h-[18px] w-[18px]"></i>
              </button>
              <!-- 斜体 -->
              <button
                class="flex h-8 w-8 items-center justify-center rounded-md text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                title="斜体 (Ctrl+I)"
              >
                <i data-lucide="italic" class="h-[18px] w-[18px]"></i>
              </button>
              <!-- インラインコード -->
              <button
                class="flex h-8 w-8 items-center justify-center rounded-md text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                title="インラインコード"
              >
                <i data-lucide="code" class="h-[18px] w-[18px]"></i>
              </button>

              <div class="mx-1 h-5 w-px bg-neutral-200"></div>

              <!-- 引用 -->
              <button
                class="flex h-8 w-8 items-center justify-center rounded-md text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                title="引用"
              >
                <i data-lucide="text-quote" class="h-[18px] w-[18px]"></i>
              </button>
              <!-- コードブロック -->
              <button
                class="flex h-8 w-8 items-center justify-center rounded-md text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                title="コードブロック"
              >
                <i data-lucide="square-code" class="h-[18px] w-[18px]"></i>
              </button>

              <div class="mx-1 h-5 w-px bg-neutral-200"></div>

              <!-- 箇条書き -->
              <button
                class="flex h-8 w-8 items-center justify-center rounded-md text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                title="箇条書き"
              >
                <i data-lucide="list" class="h-[18px] w-[18px]"></i>
              </button>
              <!-- 番号付きリスト -->
              <button
                class="flex h-8 w-8 items-center justify-center rounded-md text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                title="番号付きリスト"
              >
                <i data-lucide="list-ordered" class="h-[18px] w-[18px]"></i>
              </button>
              <!-- タスクリスト -->
              <button
                class="flex h-8 w-8 items-center justify-center rounded-md text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                title="タスクリスト"
              >
                <i data-lucide="list-checks" class="h-[18px] w-[18px]"></i>
              </button>

              <div class="mx-1 h-5 w-px bg-neutral-200"></div>

              <!-- リンク（既存）-->
              <button
                class="flex h-8 w-8 items-center justify-center rounded-md text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                title="リンク埋め込み"
              >
                <i data-lucide="link" class="h-[18px] w-[18px]"></i>
              </button>
              <!-- 画像（既存）-->
              <button
                class="flex h-8 w-8 items-center justify-center rounded-md text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900"
                title="画像挿入"
              >
                <i data-lucide="image" class="h-[18px] w-[18px]"></i>
              </button>
            </div>
          </div>

          <!-- 右：下書き / 公開 -->
          <div class="flex items-center gap-2">
            <button
              class="flex h-9 items-center gap-1.5 rounded-md border border-neutral-300 bg-white px-3 text-sm font-medium text-neutral-700 transition hover:bg-neutral-50"
            >
              <i data-lucide="save" class="h-4 w-4"></i> 下書き保存
            </button>
            <button
              class="flex h-9 items-center gap-1.5 rounded-md bg-neutral-900 px-3 text-sm font-medium text-white transition hover:bg-neutral-800"
            >
              <i data-lucide="send" class="h-4 w-4"></i> 公開
            </button>
          </div>
        </div>

        <!-- ===== 文字数カウンタ ===== -->
        <div class="flex w-full items-center justify-end px-6 pt-3">
          <span class="text-xs text-neutral-400">312/10000文字</span>
        </div>

        <!-- ===== 本文エリア ===== -->
        <div class="mx-auto flex w-full max-w-2xl flex-col gap-4 px-6 pb-24 pt-2">
          <!-- サムネイル -->
          <div
            class="flex h-44 w-full items-center justify-center rounded-lg border-2 border-dashed border-neutral-200 bg-neutral-50 text-neutral-400"
          >
            <div class="flex flex-col items-center gap-2">
              <i data-lucide="image-plus" class="h-7 w-7"></i>
              <span class="text-sm">サムネイルを設定</span>
            </div>
          </div>

          <!-- タイトル -->
          <input
            type="text"
            value="CodeMirror で作る Markdown エディタ"
            class="w-full border-none text-3xl font-bold text-neutral-900 placeholder:text-neutral-400 focus:outline-none lg:text-4xl"
          />

          <!-- タグ -->
          <div class="flex flex-wrap items-center gap-2">
            <span
              class="flex items-center gap-1 rounded-full bg-neutral-100 px-3 py-1 text-sm text-neutral-700"
              >React <i data-lucide="x" class="h-3 w-3 text-neutral-400"></i
            ></span>
            <span
              class="flex items-center gap-1 rounded-full bg-neutral-100 px-3 py-1 text-sm text-neutral-700"
              >TypeScript <i data-lucide="x" class="h-3 w-3 text-neutral-400"></i
            ></span>
            <button class="rounded-full border border-dashed border-neutral-300 px-3 py-1 text-sm text-neutral-400">
              + タグを追加
            </button>
          </div>

          <!-- 区切り -->
          <div class="my-1 h-px w-full bg-neutral-100"></div>

          <!-- CodeMirror 風エディタ本文 -->
          <div class="cm-mono text-[15px] leading-7 text-neutral-800">
            <div><span class="text-neutral-400">## </span>はじめに</div>
            <div class="h-3"></div>
            <div>
              この記事では <span class="rounded bg-neutral-100 px-1 text-pink-600">CodeMirror 6</span>
              を使った Markdown エディタの実装を解説します。
            </div>
            <div class="h-3"></div>
            <div>
              <span class="text-neutral-400">**</span><span class="font-bold">選択範囲を装飾</span><span class="text-neutral-400">**</span>
              すると、GitHub と同じようにマーカーで囲まれます。
            </div>
            <div class="h-3"></div>
            <div><span class="text-neutral-400">- </span>箇条書きの項目1</div>
            <div><span class="text-neutral-400">- </span>箇条書きの項目2</div>
            <div class="h-3"></div>
            <div><span class="text-neutral-400">&gt; </span>引用のサンプルテキスト</div>
            <div class="relative inline-block">
              <span class="text-neutral-800">テキストを入力</span
              ><span class="ml-px inline-block h-5 w-px animate-pulse bg-neutral-900 align-middle"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- 凡例 -->
      <p class="mt-4 text-center text-xs text-neutral-400">
        モック：CodeMirror は据え置き、上部ツールバーに GitHub 風書式ボタン群を追加（見出しはドロップダウン想定）
      </p>
    </div>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
