<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>モバイルナビ（ドロワー型サイドバー）モック</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      body {
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          'Hiragino Sans', 'Noto Sans JP', sans-serif;
      }
    </style>
  </head>
  <body class="bg-neutral-50 text-neutral-900">
    <!-- ===== モバイル上部ヘッダー（ハンバーガー + ロゴ） ===== -->
    <header
      class="fixed inset-x-0 top-0 z-40 flex h-14 items-center gap-3 bg-neutral-950 px-4"
    >
      <button
        onclick="openDrawer()"
        class="-ml-1 rounded-md p-1.5 text-neutral-300 transition hover:bg-neutral-900 hover:text-white"
        aria-label="メニューを開く"
      >
        <i data-lucide="menu" class="h-6 w-6"></i>
      </button>
      <div class="flex items-center gap-2">
        <span class="flex h-7 w-7 items-center justify-center rounded-lg bg-white text-xs font-bold text-neutral-950">T</span>
        <span class="text-sm font-semibold tracking-tight text-white">Tofu Admin</span>
      </div>
    </header>

    <!-- ===== コンテンツ（文脈用のダミー: About 設定） ===== -->
    <main class="px-4 pb-10 pt-14">
      <!-- パンくず -->
      <div class="flex h-12 items-center gap-2 border-b border-neutral-200 text-sm text-neutral-500">
        <span>公開サイト</span>
        <i data-lucide="chevron-right" class="h-4 w-4"></i>
        <span class="font-medium text-neutral-900">About</span>
      </div>

      <div class="py-6">
        <h1 class="text-xl font-bold tracking-tight">About 設定</h1>
        <p class="mt-1 text-sm text-neutral-500">公開サイトの About ページに表示される情報を編集します。</p>
      </div>

      <section class="rounded-xl border border-neutral-200 bg-white shadow-sm">
        <div class="border-b border-neutral-100 px-5 py-4">
          <h2 class="text-[15px] font-semibold">プロフィール</h2>
          <p class="text-xs text-neutral-500">肩書き・自己紹介・サイト説明</p>
        </div>
        <div class="space-y-4 px-5 py-5">
          <div>
            <label class="mb-1.5 block text-sm font-medium">肩書き</label>
            <div class="h-10 w-full rounded-md border border-neutral-200 bg-white px-3 py-2 text-sm text-neutral-600">ソフトウェアエンジニア</div>
          </div>
          <div>
            <label class="mb-1.5 block text-sm font-medium">自己紹介</label>
            <div class="h-20 w-full rounded-md border border-neutral-200 bg-white px-3 py-2 text-sm text-neutral-600">個人開発でブログや Web アプリを作っています。</div>
          </div>
        </div>
      </section>
    </main>

    <!-- ===== ドロワー: スクリム ===== -->
    <div
      id="scrim"
      onclick="closeDrawer()"
      class="fixed inset-0 z-50 hidden bg-neutral-900/50 backdrop-blur-sm"
    ></div>

    <!-- ===== ドロワー: 左スライドサイドバー ===== -->
    <aside
      id="drawer"
      class="fixed inset-y-0 left-0 z-50 flex w-72 -translate-x-full flex-col bg-neutral-950 text-neutral-300 shadow-2xl transition-transform duration-300"
    >
      <!-- ヘッダー（ロゴ + 閉じる） -->
      <div class="flex h-14 items-center justify-between px-4">
        <div class="flex items-center gap-2.5">
          <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-white text-sm font-bold text-neutral-950">T</span>
          <span class="text-[15px] font-semibold tracking-tight text-white">Tofu Admin</span>
        </div>
        <button
          onclick="closeDrawer()"
          class="rounded-md p-1.5 text-neutral-400 transition hover:bg-neutral-900 hover:text-white"
          aria-label="メニューを閉じる"
        >
          <i data-lucide="x" class="h-5 w-5"></i>
        </button>
      </div>

      <!-- メニュー（グループ） -->
      <nav class="flex flex-1 flex-col gap-0.5 overflow-y-auto px-3 py-2">
        <p class="px-3 pb-1.5 pt-2 text-[11px] font-semibold uppercase tracking-wider text-neutral-600">メニュー</p>
        <a href="#" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-neutral-400 transition hover:bg-neutral-900 hover:text-white">
          <i data-lucide="layout-dashboard" class="h-[18px] w-[18px]"></i> ダッシュボード
        </a>
        <a href="#" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-neutral-400 transition hover:bg-neutral-900 hover:text-white">
          <i data-lucide="file-text" class="h-[18px] w-[18px]"></i> 投稿
        </a>

        <p class="px-3 pb-1.5 pt-4 text-[11px] font-semibold uppercase tracking-wider text-neutral-600">公開サイト</p>
        <a href="#" class="flex items-center gap-3 rounded-lg bg-white px-3 py-2.5 text-sm font-medium text-neutral-950 shadow-sm">
          <i data-lucide="user-round" class="h-[18px] w-[18px]"></i> About
        </a>
        <a href="#" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-neutral-400 transition hover:bg-neutral-900 hover:text-white">
          <i data-lucide="package" class="h-[18px] w-[18px]"></i> Products
        </a>

        <p class="px-3 pb-1.5 pt-4 text-[11px] font-semibold uppercase tracking-wider text-neutral-600">設定</p>
        <a href="#" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-neutral-400 transition hover:bg-neutral-900 hover:text-white">
          <i data-lucide="circle-user" class="h-[18px] w-[18px]"></i> アカウント
        </a>
      </nav>

      <!-- ユーザー + ログアウト -->
      <div class="border-t border-neutral-800 p-3">
        <div class="flex items-center gap-3 rounded-lg px-2 py-2">
          <div class="flex h-9 w-9 items-center justify-center rounded-full bg-neutral-800 text-sm font-semibold text-white">T</div>
          <div class="min-w-0 flex-1 leading-tight">
            <p class="truncate text-sm font-medium text-white">tofu 管理者</p>
            <p class="truncate text-xs text-neutral-500">@tofu_admin</p>
          </div>
          <button class="rounded-md p-1.5 text-neutral-500 transition hover:bg-neutral-900 hover:text-white" aria-label="ログアウト">
            <i data-lucide="log-out" class="h-[18px] w-[18px]"></i>
          </button>
        </div>
      </div>
    </aside>

    <script>
      lucide.createIcons();
      function openDrawer() {
        document.getElementById('scrim').classList.remove('hidden');
        document.getElementById('drawer').classList.remove('-translate-x-full');
      }
      function closeDrawer() {
        document.getElementById('scrim').classList.add('hidden');
        document.getElementById('drawer').classList.add('-translate-x-full');
      }
    </script>
  </body>
</html>
